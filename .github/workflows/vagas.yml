name: REID

on:
  schedule:
    - cron: "0 16 * * *"   # todo dia às 13:00 (horário de Brasília)
    - cron: "0 1 * * *"    # todo dia às 22:00 (horário de Brasília)
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

concurrency:                 # nunca duas execuções ao mesmo tempo (evita conflito no histórico)
  group: reid
  cancel-in-progress: false

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes (o robô só roda se todos passarem)
        run: python -m unittest discover -s tests

      - name: Buscar vagas e enviar e-mail
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m reid

      - name: Salvar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for arquivo in vagas_vistas.json estatisticas.json; do
            if [ -f "$arquivo" ]; then git add "$arquivo"; fi
          done
          if git diff --staged --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi
          git commit -m "REID: atualiza histórico de vagas"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
